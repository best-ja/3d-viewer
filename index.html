<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#060912">
    <meta name="description" content="Bridge weigh-in-motion equipment locations by site.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BMA BWIM System</title>
    <!-- ?v= is not decoration. There is no build step to hash these names, and
         iOS Safari has no hard reload - a phone that has seen the page once
         will happily keep serving the stylesheet it already has, which looks
         exactly like a CSS change not working. js/sites.js is cache-busted for
         the same reason. Bump the number whenever the CSS changes. -->
    <link rel="stylesheet" href="css/app.css?v=2">
    <!--
      three.js is pinned to 0.163.0 on purpose. The models declare
      KHR_materials_pbrSpecularGlossiness, which no current three.js reads; they
      fall back to the pbrMetallicRoughness block every material also carries,
      and extensionsRequired is empty, so they render correctly. Bumping the
      version changes nothing here, so don't.
    -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <canvas id="scene"></canvas>

    <header id="topbar" class="panel">
        <span class="brand">BMA&nbsp;<b>BWIM</b>&nbsp;System</span>
        <button id="siteBtn" class="btn" aria-haspopup="dialog">
            <span class="nm" id="siteName">Choose bridge</span>
            <span class="caret" aria-hidden="true">&#9662;</span>
        </button>
    </header>

    <!--
      The sensor menu is a strip rather than a sidebar: it used to cover the
      left third of a phone screen, which is where the bridge is. Every chip
      is always visible - they wrap onto a second row rather than scrolling
      sideways, and All, Floor and the collapse control go with them.
    -->
    <div id="typeBar" class="panel" role="group" aria-label="Sensor types">
        <div class="tb-row">
            <div class="chips" id="typeList"></div>
            <div class="tail">
                <button class="btn small" id="allBtn" aria-pressed="false"
                        title="Light every sensor type at once">All</button>
                <button class="btn small" id="floorBtn" aria-pressed="true"
                        title="Show or hide the ground under the bridge">Floor</button>
                <button class="btn small ico" id="panelClose" aria-label="Hide the sensor menu">
                    <span aria-hidden="true">&#9650;</span>
                </button>
            </div>
        </div>
        <div class="units" id="unitList" hidden></div>
    </div>

    <button id="panelOpen" class="btn" aria-label="Show the sensor menu" aria-expanded="true">
        <span aria-hidden="true">&#9776;</span>
    </button>

    <!-- The front door. Shown from the first paint, because nothing loads
         until a bridge is chosen. -->
    <div id="picker" class="show" role="dialog" aria-modal="true" aria-label="Choose bridge">
        <div class="pbrand">BMA&nbsp;<b>BWIM</b>&nbsp;System</div>
        <h2>Choose bridge</h2>
        <div class="ph">Tap a bridge to load its model.</div>
        <div class="list" id="siteList"></div>
        <button class="btn" id="pickerClose" hidden>Close</button>
    </div>

    <div id="loader" class="hide" style="display:none">
        <div class="lt" id="loadTitle">BMA BWIM System</div>
        <div class="ls" id="loadSub">Starting&hellip;</div>
        <div class="bar"><div class="fill" id="loadFill"></div></div>
        <div class="pct" id="loadPct">0%</div>
        <button class="btn" id="loadRetry" hidden>Choose another bridge</button>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <noscript>
        <p style="padding:24px;color:#f1f5f9;font-family:sans-serif">
            This viewer needs JavaScript and WebGL.
        </p>
    </noscript>

    <script type="module" src="js/main.js"></script>
</body>
</html>
